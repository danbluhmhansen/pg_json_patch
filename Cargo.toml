[package]
name        = "pg_json_patch"
version     = "0.5.0"
edition     = "2024"
description = "A JSON Patch (RFC 6902) and JSON Merge Patch (RFC 7396) implementation for PostgreSQL."
homepage    = "https://forgejo.920301.xyz/dan/pg_json_patch"
repository  = "https://forgejo.920301.xyz/dan/pg_json_patch.git"
license     = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
default  = ["pg19"]
pg15     = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16     = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17     = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18     = ["pgrx/pg18", "pgrx-tests/pg18"]
pg19     = ["pgrx/pg19", "pgrx-tests/pg19"]
pg_test  = []
pg_bench = ["dep:pgrx-bench"]

[dependencies]
json-patch  = "5"
pgrx        = "=0.20.0"
pgrx-bench  = { version = "=0.20.0", optional = true }
pgrx-pg-sys = "=0.20.0"
serde_json  = "1"
thiserror   = "2"

[dev-dependencies]
pgrx-tests = "=0.20.0"

[profile.dev]
panic = "unwind"

[profile.release]
panic         = "unwind"
opt-level     = 3
lto           = "fat"
codegen-units = 1
