[package]
name        = "pg_json_patch"
version     = "0.2.0"
edition     = "2024"
description = "A JSON Patch (RFC 6902) and JSON Merge Patch (RFC 7396) implementation for PostgreSQL."
homepage    = "https://forgejo.920301.xyz/dan/pg_json_patch"
repository  = "https://forgejo.920301.xyz/dan/pg_json_patch.git"
license     = "MIT"
publish     = false

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_pg_json_patch"
path = "./src/bin/pgrx_embed.rs"

[features]
default = ["pg18"]
pg13    = ["pgrx/pg13", "pgrx-tests/pg13"]
pg14    = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15    = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16    = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17    = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18    = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = ["dep:pretty_assertions"]

[dependencies]
json-patch        = "4"
pgrx              = "=0.17.0"
pretty_assertions = { version = "1", optional = true }
serde_json        = "1"
thiserror         = "2"

[dev-dependencies]
pgrx-tests        = "=0.17.0"
pretty_assertions = "1"

[profile.dev]
panic = "unwind"

[profile.release]
panic         = "unwind"
opt-level     = 3
lto           = "fat"
codegen-units = 1
